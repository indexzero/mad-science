# seedpod — static analysis gate for the workflow/action YAML.
#
# PR-triggered, read-only. actionlint (+ shellcheck on run: blocks) and zizmor
# run over the workflow files on every change under workflows/ or actions/.
# Both tools are pinned: zizmor via its official SHA-pinned action, actionlint
# via its release binary fetched by rhysd's SHA-pinned download script.

name: lint
run-name: >
  lint workflows (#${{ github.run_number }})

on:
  pull_request:
    paths:
      - "workflows/**"
      - "actions/**"
      - "examples/**"

# One lint run per PR ref; supersede stale runs (read-only, safe to cancel).
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Fetch actionlint 1.7.12 via rhysd's download script, pinned to the tag's
      # commit sha on raw.githubusercontent.com (that URL IS the pin).
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # rhysd/actionlint@v1.7.12
          SCRIPT_SHA: "914e7df21a07ef503a81201c76d2b11c789d3fca"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/rhysd/actionlint/${SCRIPT_SHA}/scripts/download-actionlint.bash" \
            -o download-actionlint.bash
          bash download-actionlint.bash "$ACTIONLINT_VERSION"
          ./actionlint --version

      - name: Run actionlint
        run: |
          set -euo pipefail
          ./actionlint -color \
            workflows/release.yml \
            workflows/lint.yml \
            examples/consumer-release.yml

      # actionlint's shellcheck integration covers workflow `run:` blocks but NOT
      # composite `action.yml` run blocks (it rejects action.yml as "not a
      # workflow"). Extract each composite bash step and shellcheck it explicitly
      # so the composites' scripts are gated too (n-3).
      - name: Shellcheck composite action run blocks
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user pyyaml
          workdir="$(mktemp -d)"
          python3 - "$workdir" actions/*/action.yml <<'PY'
          import os, sys, yaml
          workdir = sys.argv[1]
          count = 0
          for path in sys.argv[2:]:
              doc = yaml.safe_load(open(path)) or {}
              steps = (doc.get("runs") or {}).get("steps") or []
              action = os.path.basename(os.path.dirname(path))
              for i, step in enumerate(steps):
                  run = step.get("run")
                  if not run:
                      continue
                  if step.get("shell", "bash") != "bash":
                      continue
                  dest = os.path.join(workdir, f"{action}-{i}.sh")
                  with open(dest, "w") as fh:
                      fh.write("#!/usr/bin/env bash\n")
                      fh.write(run)
                  count += 1
          print(f"extracted {count} composite script(s)")
          PY
          rc=0
          for s in "$workdir"/*.sh; do
            echo "── shellcheck ${s##*/}"
            shellcheck "$s" || rc=1
          done
          exit "$rc"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # Persona: pedantic — this is security tooling; hold it to the bar.
          persona: pedantic
          # Pin the zizmor version for reproducibility (matches host toolchain).
          version: "1.28.0"
          # Keep the job read-only: do not upload SARIF to the security tab
          # (that would require security-events: write).
          advanced-security: "false"
          inputs: >-
            workflows/
            actions/
            examples/
